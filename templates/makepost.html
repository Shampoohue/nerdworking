{% extends "headnbody.html" %}
{% block inside %}
    <header>
        <a href="{{url_for('index')}}"><div class="logo" style="justify-self: start;">NERDWORKING</div></a>
    </header>
    <div class="centerbox">

    <div class="card iteminblockage">
    <div class="title">
        <a href="{{url_for('index')}}"><button class="cancelbutton">X</button></a>
        <div class="twoinone">
        <div {% if user.iconfile is defined and user.iconfile %} style="background-image: url({{url_for('static', filename=user.iconfile)}});" {% endif %} class="usericon"></div>
        <div class="weaktext superweaktext">{{user.nombres}} {{user.apepaterno}} {{user.apematerno}}
            <input id="titulo" class="writer answerwrite newpostwriter" type="text" placeholder="Titulo" aria-label="Titulo" value="{% if post.titulo is defined and post.titulo %}{{post.titulo}}{% endif %}">
        </div>
        </div>
    </div>

    <div class="bodytext">
        <textarea id="body" class="writer answerwrite newpostwriter bodytextwriter" placeholder="Texto" aria-label="Texto">{% if post.body is defined and post.body %}{{post.body}}{% endif %}</textarea>
        <div class="image"><img id="showfile" src="{% if post.imagen is defined and post.imagen %}{{url_for('static', filename=post.imagen)}}{% endif %}"></div>
        <div id="clearimage" class="superweaktext" onclick="clear_image();">{% if edited %}Descartar Imagen?{% endif %}</div>
        <input id="tags" class="writer answerwrite newpostwriter" type="text" placeholder="Categorias" aria-label="Categorias">
    <div id="tagslist" class="tags"></div>
    </div>
    <div class="buttons answer twoinone" style="height: 100%;">
        <input type="file" id="image" name="file" accept="image/*" value="{% if post.imagen is defined and post.imagen %}{{url_for('static', filename=post.imagen)}}{% endif %}"/>
        <button id="publicar" onclick="publishPost()">{% if edited %}Guardar Cambios{% else %}Publicar{% endif %}</button><br>
        {% if edited %}<button class="eliminar" id="eliminar" onclick="eliminarPost()">Eliminar</button>{% endif %}
    </div>
    </div></div>

    <script>
    const tags = [];
    var imagedefault = true;

    {% for t in post.tags %}tags.push("{{t}}"); {% endfor %}

    for(let t in tags){
        document.getElementById("tagslist").innerHTML += `<button onclick="killtag(this)" style="padding-bottom: 0%; padding: 2%;">` + tags[t] + `</button>`;
    }

    document.getElementById("tags").addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            let tag = document.getElementById("tags").value.trim();
            if(!tags.includes(tag)){
                document.getElementById("tagslist").innerHTML += `<button onclick="killtag(this)" style="padding-bottom: 0%; padding: 2%;">` + tag + `</button>`;
                tags.push(tag);
            }
            document.getElementById("tags").value = "";
        }
    });

    const image = document.getElementById("image");

    image.addEventListener('change', function () {
        displayPicture(this);
    });

    function displayPicture(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();

            reader.onload = function (e) {
                document.getElementById("showfile").setAttribute('src', e.target.result);
            };
            document.getElementById("clearimage").innerHTML = "Descartar Imagen?";
            reader.readAsDataURL(input.files[0]);
        }
    }

    displayPicture(image);

    function clear_image(){
        imagedefault = false;
        image.value = '';
        document.getElementById("clearimage").innerHTML = "";
        document.getElementById("showfile").removeAttribute('src');
    }

    function killtag(tag){
        tags.pop(tag.value);
        tag.remove();
    }
    
    async function publishPost() {
        const titulo = document.getElementById('titulo').value.trim();
        const body = document.getElementById('body').value.trim();
        const file = image.files[0]; 
        const btn = document.getElementById('publicar');

        if (!titulo) {
            alert('Las publicaciones requieren un titulo.');
            return;
        }

        const formData = new FormData();
        formData.append('titulo', titulo);
        formData.append('body', body);
        if (Array.isArray(tags) && tags.length) {
            tags.forEach(t => formData.append('tags', t));
        }

        if(file) {
            formData.append('image', file);
        } else if ({% if edited %}true{% else %}false{% endif %} && imagedefault) {
            formData.append("image", "keepimage");
        } else {
            formData.append("image", null);
        }

        {% if edited %}
        formData.append("id", {{post.id}});
        formData.append("creador", {{post.creador}});
        {% endif %}

        btn.disabled = true;
        try {
            const res = await fetch('/api/posts/{% if edited %}edit{% else %}new{% endif %}', {
                    method: 'POST',
                    body: formData
                });
            
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || ('HTTP ' + res.status));
            }

            const data = await res.json();
            window.location.href = "/post/" + data.newpost;

        } catch (err) {
            console.error(err);
            alert('No se pudo publicar: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    }

    async function eliminarPost() {
        const btn = document.getElementById('publicar');

        const formData = new FormData();
        formData.append('id', {{post.id}});
        formData.append("creador", {{post.creador}});

        btn.disabled = true;
        try {
            const res = await fetch('/api/posts/delete', {
                    method: 'POST',
                    body: formData
                });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || ('HTTP ' + res.status));
            }

            const data = await res.json();
            window.location.href = "/";

        } catch (err) {
            console.error(err);
            alert('No se pudo eliminar: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    }
    </script>
{% endblock %}
