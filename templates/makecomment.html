{% extends "headnbody.html" %}
{% block inside %}
    <header>
        <a href="{{url_for('index')}}"><div class="logo" style="justify-self: start;">NERDWORKING</div></a>
    </header>
    <div class="centerbox">
    <div class="card post mainpost">
    <div class="title"><div class="twoinone">
        <div {% if post.iconfile is defined and post.iconfile %} style="background-image: url({{url_for('static', filename=post.iconfile)}});" {% endif %} class="usericon"></div>
        <div><div class="weaktext superweaktext" id="mainnamedatecareer">{{post.nombre}} ー {{post.tiempo}}<br>{{post.carrera}}</div>{{post.titulo}}</div>
    </div></div>
    <div class="bodytext">{{post.body}}</div>
    {% if post.imagen != None %}<div class="image"><img src="{{url_for('static', filename=post.imagen)}}"></div>{% endif %}
    <div class="tags">
        {% for t in post.tags %}
            <button>{{ t }}</button>
        {% endfor %}
    </div></div>

    <div class="card iteminblockage">
    <div class="title">
        <a href="{{url_for('index')}}"><button class="cancelbutton">X</button></a>
        <div class="twoinone">
        <div {% if user.iconfile is defined and user.iconfile %} style="background-image: url({{url_for('static', filename=user.iconfile)}});" {% endif %} class="usericon"></div>
        <div class="weaktext superweaktext">{{user.nombres}} {{user.apepaterno}} {{user.apematerno}}</div>
        </div>
    </div>
    
    <div class="bodytext">
        <textarea id="body" class="writer answerwrite newpostwriter bodytextwriter" placeholder="Texto" aria-label="Texto"></textarea>
        <div class="image"><img id="showfile"></div>
        <div id="clearimage" class="superweaktext" onclick="clear_image();"></div>
    </div>
    <div class="buttons answer twoinone" style="height: 100%;">
        <input type="file" id="image" name="file" accept="image/*" />
        <button id="publicar" onclick="publishReply();">Publicar</button>
    </div>
    </div></div>
    <script>
    const image = document.getElementById("image");

    image.addEventListener('change', function () {
        displayPicture(this);
    });

    displayPicture(image);

    function displayPicture(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();

            reader.onload = function (e) {
                document.getElementById("showfile").setAttribute('src', e.target.result);
            };
            document.getElementById("clearimage").innerHTML = "Descartar Imagen?";
            reader.readAsDataURL(input.files[0]);
        }
    }

    function clear_image(){
        image.value = '';
        document.getElementById("clearimage").innerHTML = "";
        document.getElementById("showfile").removeAttribute('src');
    }

    async function publishReply() {
        const body = document.getElementById('body').value.trim();
        const file = image.files[0]; 
        const btn = document.getElementById('publicar');

        const formData = new FormData();
        formData.append('body', body);

        if (file) {
            formData.append('image', file);
        } else {
            formData.append('image', null);
        }
        console.log(formData);
        btn.disabled = true;
        try {
            const res = await fetch('/api/reply/new/' + {{post.id}}, {
            method: 'POST',
            body: formData
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || ('HTTP ' + res.status));
            }

            const data = await res.json();
            console.log(data);
            window.location.href = "/post/" + {{post.id}};

        } catch (err) {
            console.error(err);
            alert('No se pudo publicar: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    }
    </script>
{% endblock %}
